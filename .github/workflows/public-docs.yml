name: Public identity documentation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout reviewed revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # verified v4 ref
        with:
          persist-credentials: false
      - name: Validate public documentation
        run: python3 tools/verify_public_docs.py
      - name: Build multilingual websites
        run: python3 websites/tools/build.py
      - name: Validate HTML, identities, locales and public assets
        run: python3 websites/tools/verify.py
      - name: Require reproducible generated files
        run: git diff --exit-code -- websites/founder websites/ecosystem
